<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#2b2f33"><title>Rasul Finance</title>
<style>
:root{--bg:#f2f3f4;--cd:#fff;--tx:#202326;--mu:#737a80;--ac:#14a65a;--rd:#dc4338;--bd:#e2e5e8;--gr:#2b2f33;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121416;--cd:#1c1f22;--tx:#eceef0;--mu:#8b9298;--bd:#2c3034;--gr:#3a4047;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121416;--cd:#1c1f22;--tx:#eceef0;--mu:#8b9298;--bd:#2c3034;--gr:#3a4047;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:20px;margin:6px 0 12px;display:flex;justify-content:space-between;align-items:center}h2{font-size:17px;margin:16px 0 8px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g .c{margin:0}
.big{font-size:24px;font-weight:700;letter-spacing:-.5px}.hero{font-size:34px;font-weight:700;letter-spacing:-1px}
.mu{color:var(--mu);font-size:13px}.r{color:var(--rd)}.gr{color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.r2{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd)}
input,select{font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);min-width:0;flex:1 1 110px}
button{font:inherit;font-weight:600;padding:9px 14px;border:0;border-radius:10px;background:var(--gr);color:#fff;cursor:pointer}
button.p{background:var(--ac)}button.d{background:transparent;color:var(--rd);padding:4px 8px}
.chip{display:inline-block;background:var(--bg);border-radius:8px;padding:3px 8px;margin:3px 4px 0 0;font-size:13px}.chip a{color:var(--rd);cursor:pointer}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ac)}.bar i.o{background:var(--rd)}
.w{background:rgba(220,67,56,.12);color:var(--rd);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;color:var(--mu);font-size:11px;padding:6px 0;font-weight:500}nav button.on{color:var(--ac);font-weight:700}
nav b{display:block;font-size:19px;line-height:1.1}
#t{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--gr);color:#fff;padding:8px 14px;border-radius:10px;display:none;z-index:9}
table{width:100%;border-collapse:collapse}th,td{padding:5px 2px;text-align:right;border-bottom:1px solid var(--bd);font-size:13px}th:first-child,td:first-child{text-align:left}textarea{width:100%;font:12px/1.3 ui-monospace,monospace;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:6px 0}nav{overflow-x:auto}nav button{min-width:66px}html{-webkit-text-size-adjust:100%}body{overflow-x:hidden;-webkit-tap-highlight-color:transparent}button{touch-action:manipulation}
@media (max-width:700px){#app{padding:10px 10px 104px}.hero{font-size:30px}.big{font-size:21px}input,select{font-size:16px;min-height:46px;flex:1 1 100%}.row>input[type=number]:not(:only-of-type){flex:1 1 40%}button{min-height:46px;font-size:15px}.row>button.p{flex:1 1 100%}button.d{min-width:46px;font-size:18px}.chip{padding:6px 10px;font-size:15px}.chip a{padding:6px;font-size:17px}.r2{align-items:center}.c{padding:13px}nav{padding-top:4px}nav button{min-height:54px;min-width:72px;font-size:11px}nav b{font-size:22px}textarea{font-size:16px}th,td{font-size:12px}h1 button{min-height:40px;min-width:46px}}
</style></head><body><div id="app"><h1><span>Rasul Finance</span><button onclick="theme()">◐</button></h1><div id="v"></div></div><div id="t"></div><nav id="n"></nav>
<script>
const $=s=>document.querySelector(s),v=i=>$('#'+i).value,N=i=>+v(i)||0,pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),T=iso(new Date()),f=n=>Math.round(n).toLocaleString('ru-RU')+' ₸';
const dm=s=>s.slice(8)+'.'+s.slice(5,7),uid=()=>Math.random().toString(36).slice(2,9),sum=(a,k)=>a.reduce((z,x)=>z+(k?x[k]:x),0);
const addD=(s,k)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+k);return iso(d)};
const np=s=>{const d=new Date(s+'T00:00');for(let i=0;i<40;i++){d.setDate(d.getDate()+1);if(d.getDate()==5||d.getDate()==20)return iso(d)}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null;try{S=JSON.parse(localStorage.getItem('rf1')||'null')}catch(e){}
S=S||{start:T,bal0:0,rate:8000,shifts:[],act:{},sv:[],exp:[],pays:[],rl:[],rent:{amt:100000,mom:90000,top:10000},al:{food:21500,save:0,early:0},
loans:[{id:'k',name:'Kaspi Red+',bank:'Kaspi Bank',d0:49096,lim:50000,pay:12506,day:20,plan:'2026-12'},{id:'f',name:'Freedom Bank',bank:'Freedom Bank',d0:119634,pay:7175,day:6,end:'2028-09-06'}]};
const save=()=>{try{localStorage.setItem('rf1',JSON.stringify(S))}catch(e){}};
let tab='home',mon=T.slice(0,7);
const toast=m=>{const t=$('#t');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const theme=()=>{const r=document.documentElement,d=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=d=='dark'?'light':'dark'};
const CATS=[['Супермаркеты',25000],['Кафе и рестораны',4000],['Транспорт',0],['Дом и ремонт',2000],['Образование',0],['Покупки',0],['Развлечения',0],['Прочее',12000]];
// ---- логика ----
const po=d=>{const[y,m,dd]=d.split('-').map(Number);return dd<=15?iso(new Date(y,m-1,20)):iso(new Date(y,m,5))};
const pk=()=>[...new Set(S.shifts.map(s=>po(s.date)).concat(Object.keys(S.act)))].sort();
const poAmt=k=>k in S.act?S.act[k]:S.shifts.filter(s=>po(s.date)==k).length*S.rate;
const debt=l=>Math.max(0,l.d0-sum(S.pays.filter(p=>p.l==l.id).map(p=>p.amt-(p.int||0))));
const fl=()=>[...S.exp.map(e=>({d:e.date,a:-e.amt,o:1})),...S.pays.map(p=>({d:p.date,a:-p.amt,o:1})),...S.rl.map(r=>({d:r.date,a:r.k=='mom'?r.amt:-r.amt,o:r.k!='mom'})),...S.sv.map(x=>({d:x.date,a:-x.amt})),...pk().filter(k=>k<=T).map(k=>({d:k,a:poAmt(k)}))].filter(x=>x.d>=S.start);
const bal=()=>S.bal0+sum(fl(),'a');
const ev=(a,b)=>{const r=[];for(let d=new Date(a+'T00:00');iso(d)<=b;d.setDate(d.getDate()+1)){const s=iso(d),dd=d.getDate(),m=s.slice(0,7);
if(dd==7){const x=S.rent.amt-sum(S.rl.filter(q=>q.k=='rent'&&q.date.slice(0,7)==m),'amt');if(x>0)r.push({s,t:'Аренда',a:-x})}
if(dd==5&&!S.rl.some(q=>q.k=='mom'&&q.date.slice(0,7)==m))r.push({s,t:'Перевод от мамы',a:S.rent.mom});
if((dd==5||dd==20)&&s>T&&poAmt(s)>0)r.push({s,t:'Зарплата',a:poAmt(s)});
S.loans.forEach(l=>{if(l.day==dd&&debt(l)>0&&!S.pays.some(p=>p.l==l.id&&p.date.slice(0,7)==m))r.push({s,t:l.name,L:1,a:-Math.min(l.pay,debt(l))})})}
return r.sort((x,y)=>x.s<y.s?-1:1)};
const nd=l=>{for(let i=0;i<14;i++){const s=iso(new Date(+T.slice(0,4),+T.slice(5,7)-1+i,l.day));if(s>=T&&!S.pays.some(p=>p.l==l.id&&p.date.slice(0,7)==s.slice(0,7)))return s}};
const late=l=>{const c=T.slice(0,8)+pad(l.day);return debt(l)>0&&c<T&&c>=S.start&&!S.pays.some(p=>p.l==l.id&&p.date.slice(0,7)==T.slice(0,7))};
const mname=(s,k)=>{const d=new Date(+s.slice(0,4),+s.slice(5,7)-1+k,1);return d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})};
// ---- действия ----
const go=t=>{E={};tab=t;render()};
function addShift(){if(!v('sd'))return;S.shifts.push({id:uid(),date:v('sd'),t:v('st')});save();render()}
function delShift(i){S.shifts=S.shifts.filter(s=>s.id!=i);save();render()}
function setAct(k){const x=v('a'+k);if(x==='')delete S.act[k];else S.act[k]=+x;save();render()}
function addExp(){const e={id:uid(),date:v('ed'),cat:v('ec'),amt:N('ea'),note:v('en').trim()};if(!e.amt||!e.date)return toast('Укажите дату и сумму');
if(S.exp.some(x=>x.date==e.date&&x.cat==e.cat&&x.amt==e.amt&&x.note==e.note))return toast('Такая трата уже есть');S.exp.push(e);mon=e.date.slice(0,7);save();render()}
function delExp(i){S.exp=S.exp.filter(x=>x.id!=i);save();render()}
function setMon(){mon=v('mf')||mon;render()}
function payLoan(i){const p={id:uid(),l:i,date:v('pd'+i),amt:N('pa'+i),int:N('pi'+i)};if(!p.amt||!p.date)return toast('Укажите сумму платежа');if(p.int>p.amt)return toast('Проценты больше платежа');S.pays.push(p);save();render()}
function setDebt(i){const l=S.loans.find(x=>x.id==i),x=N('ds'+i);l.d0=x+sum(S.pays.filter(p=>p.l==i).map(p=>p.amt-(p.int||0)));save();render()}
function delLoan(i){S.loans=S.loans.filter(l=>l.id!=i);S.pays=S.pays.filter(p=>p.l!=i);save();render()}
function delPay(i){S.pays=S.pays.filter(p=>p.id!=i);save();render()}
function addLoan(){const l={id:uid(),name:v('ln').trim(),d0:N('ld'),pay:N('lp'),day:N('lx')};if(!l.name||!l.d0||!l.pay||l.day<1||l.day>28)return toast('Заполните поля, день от 1 до 28');S.loans.push(l);save();render()}
function addRent(){const r={id:uid(),k:v('rk'),date:v('rd'),amt:N('ra')};if(!r.amt)return toast('Укажите сумму');if(S.rl.some(x=>x.k==r.k&&x.date==r.date&&x.amt==r.amt))return toast('Такая запись уже есть');S.rl.push(r);save();render()}
function delRent(i){S.rl=S.rl.filter(x=>x.id!=i);save();render()}
function setBal(){S.bal0=N('b0');S.start=v('bs')||T;save();render()}
function addSv(){const a=N('sv');if(a>0){S.sv.push({id:uid(),date:T,amt:a});save();render()}}
function setAl(k,x){S.al[k]=Math.max(0,+x||0);save();render()}
// ---- экраны ----
const V={
home(){const b=bal(),e=ev(T,addD(T,30));let c=b,mn=b;e.forEach(x=>{c+=x.a;mn=Math.min(mn,c)});
const M=T.slice(0,7),m=fl().filter(x=>x.d.slice(0,7)==M),n1=np(T),bill=e.find(x=>x.a<0&&x.t!='Аренда')||e.find(x=>x.a<0),ds=S.loans.filter(late);
return `<div class=c><div class=mu>Свободно без риска (30 дней, без учёта будущих смен)</div><div class="hero ${mn<0?'r':'gr'}">${f(mn)}</div><div class=mu>На карте сейчас: ${f(b)}. Свободные деньги — это остаток после всех обязательных платежей.</div>${mn<0?'<div class=w>Не хватает денег на обязательные платежи: проверьте раздел «Бюджет».</div>':''}</div>
${ds.map(l=>`<div class=w>Просрочка: ${esc(l.name)} (платёж ${l.day}-го числа не внесён)</div>`).join('')}
<div class=g><div class=c><div class=mu>Доходы за месяц</div><div class="big gr">${f(sum(m.filter(x=>x.a>0),'a'))}</div></div>
<div class=c><div class=mu>Расходы за месяц</div><div class="big r">${f(-sum(m.filter(x=>x.a<0&&x.o),'a'))}</div></div>
<div class=c><div class=mu>Общий долг</div><div class=big>${f(sum(S.loans.map(debt)))}</div></div>
<div class=c><div class=mu>Накопления</div><div class=big>${f(sum(S.sv,'amt'))}</div></div>
<div class=c><div class=mu>Следующая зарплата ${dm(n1)}</div><div class=big>${f(poAmt(n1))}</div></div>
<div class=c><div class=mu>Ближайший платёж</div><div class=big>${bill?f(-bill.a):'—'}</div><div class=mu>${bill?dm(bill.s)+' · '+esc(bill.t):'нет'}</div></div></div>
<h2>Отложить в накопления</h2><div class=c><div class=row><input type=number id=sv placeholder="Сумма, ₸"><button class=p onclick=addSv()>Отложить</button></div></div>
<h2>Остаток на карте</h2><div class=c><div class=row><input type=number id=b0 value=${S.bal0} placeholder="Остаток"><input type=date id=bs value=${S.start}><button onclick=setBal()>Сохранить</button></div><div class=mu>Остаток на выбранную дату. Операции с этой даты считаются автоматически.</div></div>`},
shifts(){const ks=pk().reverse();return `<div class=c><div class=row><input type=date id=sd value=${T}><select id=st><option value=d>☀ Дневная<option value=n>🌙 Ночная</select><button class=p onclick=addShift()>Добавить смену</button></div><div class=mu>${f(S.rate)} за смену. Смены 1–15 числа входят в выплату 20-го, смены 16–31 — в выплату 5-го следующего месяца.</div></div>`+
(ks.length?'':'<div class=c>Смен пока нет. Добавьте первую, и здесь появятся выплаты.</div>')+ks.map(k=>{const sh=S.shifts.filter(s=>po(s.date)==k).sort((a,b)=>a.date<b.date?-1:1);
return `<div class=c><b>Выплата ${dm(k)}</b> <span class=mu>${k>T?'ожидается':k in S.act?'факт':'по сменам'}</span><div class=big>${f(poAmt(k))}</div><div class=mu>${sh.length} смен × ${f(S.rate)} = ${f(sh.length*S.rate)}</div>
<div class=row><input type=number id="a${k}" placeholder="Фактическая выплата" value="${k in S.act?S.act[k]:''}"><button onclick="setAct('${k}')">Записать факт</button></div>
<div>${sh.map(s=>`<span class=chip>${dm(s.date)} ${s.t=='n'?'🌙':'☀'} <a onclick="delShift('${s.id}')">×</a></span>`).join('')}</div></div>`}).join('')},
exp(){const L=S.exp.filter(e=>e.date.slice(0,7)==mon).sort((a,b)=>a.date<b.date?1:-1),tot=sum(L,'amt'),pm=iso(new Date(+mon.slice(0,4),+mon.slice(5,7)-2,1)).slice(0,7),pt=sum(S.exp.filter(e=>e.date.slice(0,7)==pm),'amt');
return `<div class=c><div class=row><input type=date id=ed value=${T}><select id=ec>${CATS.map(c=>`<option>${c[0]}`).join('')}</select><input type=number id=ea placeholder="Сумма, ₸"><input id=en placeholder="Комментарий"><button class=p onclick=addExp()>Добавить расход</button></div></div>
<div class=row><input type=month id=mf value=${mon} onchange=setMon()></div>
<div class=c><div class=mu>Расходы за месяц</div><div class="big r">${f(tot)}</div><div class=mu>Прошлый месяц: ${f(pt)} (${tot>=pt?'+':'−'}${f(Math.abs(tot-pt))})</div></div>
<div class=c>${CATS.map(([n,bd])=>{const s=sum(L.filter(e=>e.cat==n),'amt');if(!s&&!bd)return'';const p=bd?Math.min(100,s/bd*100):100;return `<div style="margin-bottom:10px"><div class=r2 style="border:0;padding:0"><span>${n}</span><span class="${bd&&s>bd?'r':''}">${f(s)}${bd?' / '+f(bd):''}</span></div><div class=bar><i class="${bd&&s>bd?'o':''}" style="width:${p}%"></i></div>${bd&&s>bd?`<div class="mu r">Превышение бюджета на ${f(s-bd)}</div>`:''}</div>`}).join('')||'<span class=mu>Расходов в этом месяце нет.</span>'}</div>
<div class=c>${L.map(e=>`<div class=r2><span>${dm(e.date)} · ${e.cat}<br><span class=mu>${esc(e.note)}</span></span><span>${f(e.amt)} <button class=d onclick="delExp('${e.id}')">×</button></span></div>`).join('')||'<span class=mu>Список пуст.</span>'}</div>`},
loans(){const tot=sum(S.loans.map(debt));return `<div class=c><div class=mu>Общая задолженность</div><div class=big>${f(tot)}</div><div class=mu>Прогноз без процентов и досрочных платежей: через 3 мес. ${f(sum(S.loans.map(l=>Math.max(0,debt(l)-l.pay*3))))} · 6 мес. ${f(sum(S.loans.map(l=>Math.max(0,debt(l)-l.pay*6))))} · 12 мес. ${f(sum(S.loans.map(l=>Math.max(0,debt(l)-l.pay*12))))}</div></div>`+
S.loans.map(l=>{const d=debt(l),n=nd(l),h=S.pays.filter(p=>p.l==l.id).sort((a,b)=>a.date<b.date?1:-1);let cl='';
if(d>0&&n){const k=Math.ceil(d/l.pay);cl=`Закрытие без процентов: ${mname(n,k-1)} (${k} платежей).`;if(l.plan){const[py,pm]=l.plan.split('-').map(Number),cnt=(py-+n.slice(0,4))*12+pm-+n.slice(5,7)+1;cl+=cnt>=1?` Чтобы закрыть к ${mname(l.plan+'-01',0)}: ${f(d/cnt)} в месяц.`:' Плановая дата уже прошла.'}}
return `<div class=c><b>${esc(l.name)}</b>${late(l)?' <span class=r>просрочка</span>':''}<div class=big>${f(d)}</div><div class=mu>${l.lim?'Лимит '+f(l.lim)+' · ':''}платёж ${f(l.pay)} · ${l.day}-го числа${l.end?' · до '+l.end.split('-').reverse().join('.'):''}</div><div class=mu>${d>0&&n?'Следующий платёж: '+dm(n)+'. ':'Долг закрыт. '}${cl}</div><div class=mu>Фиксированный платёж не считается полным погашением: проценты укажите отдельно.</div>
<div class=row><input type=date id="pd${l.id}" value=${T}><input type=number id="pa${l.id}" value=${l.pay} placeholder="Платёж"><input type=number id="pi${l.id}" placeholder="Из них проценты"><button class=p onclick="payLoan('${l.id}')">Внести платёж</button></div>
<div class=row><input type=number id="ds${l.id}" value=${Math.round(d)}><button onclick="setDebt('${l.id}')">Исправить остаток</button><button class=d onclick="delLoan('${l.id}')">Удалить кредит</button></div>
${h.map(p=>`<div class=r2><span>${dm(p.date)} · платёж ${f(p.amt)}${p.int?' (проценты '+f(p.int)+')':''}</span><button class=d onclick="delPay('${p.id}')">×</button></div>`).join('')}</div>`}).join('')+
`<h2>Добавить кредит</h2><div class=c><div class=row><input id=ln placeholder="Название"><input type=number id=ld placeholder="Остаток долга"><input type=number id=lp placeholder="Платёж"><input type=number id=lx placeholder="День платежа"><button class=p onclick=addLoan()>Добавить</button></div></div>`},
flat(){const M=T.slice(0,7),L=S.rl.filter(r=>r.date.slice(0,7)==M),mom=sum(L.filter(r=>r.k=='mom'),'amt'),pd=sum(L.filter(r=>r.k=='rent'),'amt');
return `<div class=g><div class=c><div class=mu>Аренда в месяц</div><div class=big>${f(S.rent.amt)}</div></div><div class=c><div class=mu>Перевод от мамы</div><div class="big gr">${f(mom)}</div><div class=mu>ожидается ${f(S.rent.mom)}, 5-го</div></div>
<div class=c><div class=mu>Недостаёт (моя доплата)</div><div class=big>${f(Math.max(0,S.rent.amt-mom))}</div></div><div class=c><div class=mu>Оплачено / осталось, 7-го</div><div class=big>${f(pd)}</div><div class=mu>осталось ${f(Math.max(0,S.rent.amt-pd))}</div></div></div>
<h2>Записать операцию</h2><div class=c><div class=row><select id=rk onchange="$('#ra').value=this.value=='mom'?${S.rent.mom}:${S.rent.amt}"><option value=mom>Перевод от мамы<option value=rent>Оплата аренды</select><input type=date id=rd value=${T}><input type=number id=ra value=${S.rent.mom}><button class=p onclick=addRent()>Записать</button></div><div class=mu>Перевод от мамы учитывается как отдельный доход, не как зарплата.</div></div>
<div class=c>${S.rl.slice().sort((a,b)=>a.date<b.date?1:-1).map(r=>`<div class=r2><span>${dm(r.date)} · ${r.k=='mom'?'Перевод от мамы':'Оплата аренды'}</span><span class="${r.k=='mom'?'gr':'r'}">${f(r.amt)} <button class=d onclick="delRent('${r.id}')">×</button></span></div>`).join('')||'<span class=mu>История пуста.</span>'}</div>`},
budget(){const n1=np(T),n2=np(n1),A=sum(Object.values(S.al));let c=bal(),h='';
[[T,addD(n1,-1)],[n1,addD(n2,-1)]].forEach(([a,b],i)=>{const e=ev(a,b);c-=A;let mn=c;e.forEach(x=>{c+=x.a;mn=Math.min(mn,c)});
h+=`<div class=c><b>${dm(a)} – ${dm(b)}</b> <span class=mu>${i?'следующий период':'текущий период'}</span>${e.map(x=>`<div class=r2><span>${dm(x.s)} · ${esc(x.t)}</span><span class="${x.a<0?'r':'gr'}">${f(x.a)}</span></div>`).join('')||'<div class=mu>Событий нет</div>'}
<div class=r2><span>Распределение (питание, накопления, досрочные)</span><span class=r>${f(-A)}</span></div><div class=r2><b>Остаток на конец периода</b><b class="${c<0?'r':'gr'}">${f(c)}</b></div>${mn<0?`<div class=w>Баланс уйдёт в минус: до ${f(mn)}. Уменьшите распределение или добавьте смены.</div>`:''}</div>`});
return `<div class=c><b>Распределение на период</b><div class=mu>Порядок: обязательные платежи, аренда, питание и транспорт, накопления, досрочное погашение. Суммы меняются вручную.</div>${[['food','Питание и транспорт'],['save','Накопления'],['early','Досрочное погашение']].map(([k,n])=>`<div class=row><span style="flex:1 1 160px;align-self:center">${n}</span><input type=number value=${S.al[k]} onchange="setAl('${k}',this.value)"></div>`).join('')}<div class=mu>Питание по умолчанию — половина месячных ориентиров (21 500 ₸). Суммы вычитаются в начале каждого периода: оценка осторожная.</div></div>`+h},
tools(){return ''}};
const TABS=[['home','⌂','Главная'],['shifts','▦','Зарплата'],['exp','−','Расходы'],['loans','%','Кредиты'],['flat','⌂','Квартира'],['budget','◔','Бюджет']];
function render(){$('#v').innerHTML=V[tab]();$('#n').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('')}
// ---- v2: правка записей, аналитика, прогноз, данные ----
let E={},RC=0;
function norm(){S.cb=S.cb||{};S.ord=S.ord||['food','save','early'];S.sv=S.sv||[]}norm();
TABS[0][1]='◉';TABS[1][1]='₸';TABS[4][1]='⌂';TABS.push(['anal','◧','Аналитика'],['more','⋯','Ещё']);
function ed(k,i){E[k]=i;render()}
const wrap=(k,a,fn)=>function(x){if(!E[k])return fn(x);const id=E[k],keep=S[a].slice();S[a]=S[a].filter(z=>z.id!=id);const n=S[a].length;E[k]=null;fn(x);if(S[a].length==n){S[a]=keep;E[k]=id;render()}};
const _as=addShift;addShift=wrap('sh','shifts',()=>{if(S.shifts.some(s=>s.date==v('sd')&&s.t==v('st')))return toast('Такая смена уже есть');_as()});
const _ae=addExp;addExp=wrap('exp','exp',_ae);const _ar=addRent;addRent=wrap('rl','rl',_ar);
const _pl=payLoan;payLoan=wrap('pay','pays',i=>{if(S.pays.some(p=>p.l==i&&p.date==v('pd'+i)&&p.amt==N('pa'+i)))return toast('Такой платёж уже внесён');_pl(i)});
function fill(){const q=(k,m)=>E[k]&&S[m].find(a=>a.id==E[k]),set=(i,x)=>{const e=$('#'+i);if(e)e.value=x},bt=c=>{const b=$('button[onclick^="'+c+'"]');if(b)b.textContent='Сохранить изменения'};let x;
if(x=q('exp','exp')){set('ed',x.date);set('ec',x.cat);set('ea',x.amt);set('en',x.note);bt('addExp');scrollTo(0,0)}
if(x=q('sh','shifts')){set('sd',x.date);set('st',x.t);bt('addShift');scrollTo(0,0)}
if(x=q('rl','rl')){set('rk',x.k);set('rd',x.date);set('ra',x.amt);bt('addRent');scrollTo(0,0)}
if(x=q('pay','pays')){set('pd'+x.l,x.date);set('pa'+x.l,x.amt);set('pi'+x.l,x.int||'');bt("payLoan('"+x.l+"')");const e=$('#pd'+x.l);if(e)e.scrollIntoView({block:'center'})}}
const _r=render;render=function(){CATS.forEach(c=>{if(c[0] in S.cb)c[1]=S.cb[c[0]]});_r();fill()};
const dec=h=>h.replace(/<button class=d onclick="del(Exp|Rent|Pay)\('(\w+)'\)">/g,(m,t,i)=>`<button class=d style="color:var(--mu)" onclick="ed('${{Exp:'exp',Rent:'rl',Pay:'pay'}[t]}','${i}')">✎</button>`+m).replace(/<a onclick="delShift\('(\w+)'\)">/g,(m,i)=>`<a onclick="ed('sh','${i}')" style="color:var(--mu)">✎</a> `+m);
['exp','shifts','loans','flat'].forEach(k=>{const o=V[k];V[k]=()=>dec(o())});
const notes=()=>{const n=[];ev(T,addD(T,3)).filter(x=>x.a<0).forEach(x=>n.push('Платёж '+f(-x.a)+' · '+x.t+' — '+(x.s==T?'сегодня':dm(x.s))));const M=T.slice(0,7);CATS.forEach(([c,b])=>{if(b&&sum(S.exp.filter(e=>e.cat==c&&e.date.slice(0,7)==M),'amt')>b)n.push('Превышен бюджет: '+c)});return n.length?`<div class=c><b>Уведомления</b>${n.map(x=>`<div class=r2>${esc(x)}</div>`).join('')}</div>`:''};
const _h=V.home;V.home=()=>notes()+_h();
function mv(i,d){const j=i+d;if(j<0||j>=S.ord.length)return;[S.ord[i],S.ord[j]]=[S.ord[j],S.ord[i]];save();render()}
V.budget=()=>{const n1=np(T),n2=np(n1),O=S.ord,nm={food:'Питание и транспорт',save:'Накопления',early:'Досрочное погашение'},A=sum(O.map(k=>S.al[k]));let c=bal(),h='';
[[T,addD(n1,-1)],[n1,addD(n2,-1)]].forEach(([a,b],i)=>{const e=ev(a,b);let r=c,mn=c;e.forEach(x=>{r+=x.a;mn=Math.min(mn,r)});let av=mn;
h+=`<div class=c><b>${dm(a)} – ${dm(b)}</b> <span class=mu>${i?'следующий':'текущий'} период</span>${e.map(x=>`<div class=r2><span>${dm(x.s)} · ${esc(x.t)}</span><span class="${x.a<0?'r':'gr'}">${f(x.a)}</span></div>`).join('')||'<div class=mu>Событий нет</div>'}${O.map(k=>{av-=S.al[k];return `<div class=r2><span>${nm[k]}</span><span class="${av<0?'r':''}">${f(-S.al[k])}${av<0?' · не хватает':''}</span></div>`}).join('')}`;
c=r-A;h+=`<div class=r2><b>Остаток на конец периода</b><b class="${c<0?'r':'gr'}">${f(c)}</b></div>${av<0?'<div class=w>Денег не хватает: баланс уйдёт в минус до '+f(av)+'. Уменьшите суммы или поднимите приоритет важного.</div>':''}</div>`});
return `<div class=c><b>Приоритеты распределения</b><div class=mu>Сначала платятся обязательные платежи и аренда, затем статьи по порядку. Суммы указаны на каждый период.</div>${O.map((k,i)=>`<div class=row><span style="flex:1 1 140px;align-self:center">${i+1}. ${nm[k]}</span><input type=number value=${S.al[k]} onchange="setAl('${k}',this.value)"><button onclick="mv(${i},-1)">▲</button><button onclick="mv(${i},1)">▼</button></div>`).join('')}</div>`+h};
const fc=N=>{const e=ev(T,addD(T,Math.round(30.4*N))).filter(x=>!x.L),P=2*N,lp=sum(S.loans.map(l=>Math.min(debt(l),l.pay*N))),o={inc:sum(e.filter(x=>x.a>0),'a'),rent:-sum(e.filter(x=>x.a<0),'a'),lp,ex:S.al.food*P,sv:S.al.save*P,er:S.al.early*P};o.b=bal()+o.inc-o.rent-lp-o.ex-o.sv-o.er;o.d=Math.max(0,sum(S.loans.map(debt))-lp-o.er);o.sa=sum(S.sv,'amt')+o.sv;return o};
V.anal=()=>{const F=fl(),ms=[];for(let i=5;i>=0;i--){const d=new Date(+T.slice(0,4),+T.slice(5,7)-1-i,1),m=iso(d).slice(0,7),x=F.filter(a=>a.d.slice(0,7)==m);ms.push({n:d.toLocaleDateString('ru-RU',{month:'short'}),i:sum(x.filter(a=>a.a>0),'a'),o:-sum(x.filter(a=>a.a<0&&a.o),'a')})}
const mx=Math.max(1,...ms.flatMap(a=>[a.i,a.o])),L=S.exp.filter(e=>e.date.slice(0,7)==mon),tt=sum(L,'amt'),Z=[3,6,12].map(fc),R=[['Доходы (смены и перевод мамы)','inc'],['Аренда','rent'],['Платежи по кредитам','lp'],['Питание и прочее','ex'],['Накопления (план)','sv'],['Досрочное погашение','er'],['Баланс','b'],['Остаток долга','d'],['Накопления всего','sa']];
return `<h2>Доходы и расходы по месяцам</h2><div class=c>${ms.map(a=>`<div style="margin-bottom:8px"><div class=r2 style="border:0;padding:0"><span>${a.n}</span><span class=mu>${f(a.i)} / ${f(a.o)}</span></div><div class=bar><i style="width:${a.i/mx*100}%"></i></div><div class=bar><i class=o style="width:${a.o/mx*100}%"></i></div></div>`).join('')}<div class=mu>Зелёная полоса — доход, красная — расход.</div></div>
<h2>Категории за ${mon}</h2><div class=c><div class=row><input type=month value=${mon} onchange="mon=this.value||mon;render()"></div>${CATS.map(([n])=>{const s=sum(L.filter(e=>e.cat==n),'amt');return s?`<div style="margin-bottom:8px"><div class=r2 style="border:0;padding:0"><span>${n}</span><span>${f(s)} · ${Math.round(s/tt*100)}%</span></div><div class=bar><i style="width:${s/tt*100}%"></i></div></div>`:''}).join('')||'<span class=mu>Расходов нет.</span>'}</div>
<h2>Прогноз</h2><div class=c><table><tr><th></th><th>3 мес.</th><th>6 мес.</th><th>12 мес.</th></tr>${R.map(([n,k])=>`<tr><td>${n}</td>${Z.map(o=>`<td class="${k=='b'&&o.b<0?'r':''}">${f(o[k])}</td>`).join('')}</tr>`).join('')}</table><div class=mu>Доходы — только по внесённым сменам и переводу мамы: будущие смены не выдуманы. Проценты не учитываются. Кредиты закроются примерно к ${mname(T,Math.max(0,...S.loans.map(l=>Math.ceil(debt(l)/l.pay))))}. Эти расчёты предварительные.</div></div>`};
const fl2=()=>[...S.exp.map(e=>({d:e.date,a:-e.amt,t:e.cat+(e.note?': '+e.note:'')})),...S.pays.map(p=>({d:p.date,a:-p.amt,t:'Платёж: '+((S.loans.find(l=>l.id==p.l)||{}).name||'')})),...S.rl.map(r=>({d:r.date,a:r.k=='mom'?r.amt:-r.amt,t:r.k=='mom'?'Перевод от мамы':'Аренда'})),...S.sv.map(x=>({d:x.date,a:-x.amt,t:'Накопления'})),...pk().filter(k=>k<=T).map(k=>({d:k,a:poAmt(k),t:'Зарплата'}))].filter(x=>x.d>=S.start);
const hist=()=>{let c=S.bal0;return fl2().sort((a,b)=>a.d<b.d?-1:1).map(x=>({...x,c:(c+=x.a)})).reverse()};
const tbl=s=>['Дата','Операция','Сумма','Баланс'].join(s)+'\n'+hist().reverse().map(x=>[x.d,x.t.replace(/[;\t\n]/g,' '),x.a,x.c].join(s)).join('\n');
function flt(q){q=q.toLowerCase();document.querySelectorAll('.hr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}
function cp(i){const t=$('#'+i);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand('copy')}catch(e2){}}toast('Скопировано')}
function setL(i,k,x){const l=S.loans.find(a=>a.id==i);l[k]=['pay','day','lim'].includes(k)?(+x||0):x;save();render()}
function setSv(i,x){S.sv.find(a=>a.id==i).amt=+x||0;save();render()}
function delSv(i){S.sv=S.sv.filter(a=>a.id!=i);save();render()}
function restore(){try{const o=JSON.parse(v('bk'));if(!o.loans||!o.exp)throw 0;S=o;norm();save();toast('Данные восстановлены');render()}catch(e){toast('Неверная копия данных')}}
function resetAll(){if(!RC){RC=1;return render()}try{localStorage.removeItem('rf1')}catch(e){}location.reload()}
V.more=()=>{const L=(l,val,c)=>`<div class=row><span class=mu style="flex:1 1 150px;align-self:center">${l}</span><input type=number value="${val}" onchange="${c}"></div>`;
return `<h2>История и поиск</h2><div class=c><input placeholder="Поиск: дата, категория, сумма" oninput="flt(this.value)" style="width:100%">${hist().map(x=>`<div class="r2 hr"><span>${dm(x.d)} · ${esc(x.t)}</span><span class="${x.a<0?'r':'gr'}">${f(x.a)}<br><span class=mu>баланс ${f(x.c)}</span></span></div>`).join('')||'<div class=mu>Операций нет.</div>'}</div>
<h2>Настройки</h2><div class=c>${L('Ставка за смену, ₸',S.rate,"S.rate=+this.value||0;save();render()")}${L('Аренда в месяц, ₸',S.rent.amt,"S.rent.amt=+this.value||0;save();render()")}${L('Перевод от мамы, ₸',S.rent.mom,"S.rent.mom=+this.value||0;save();render()")}<b>Месячные бюджеты</b>${CATS.map(c=>L(c[0],c[1],"S.cb['"+c[0]+"']=+this.value||0;save();render()")).join('')}</div>
<h2>Параметры кредитов</h2>${S.loans.map(l=>`<div class=c><b>${esc(l.name)}</b>${[['name','Название','text'],['pay','Платёж','number'],['day','День платежа','number'],['lim','Лимит','number'],['plan','План закрытия','month'],['end','Срок до','date']].map(([k,n,t])=>`<div class=row><span class=mu style="flex:1 1 130px;align-self:center">${n}</span><input type=${t} value="${esc(l[k]||'')}" onchange="setL('${l.id}','${k}',this.value)"></div>`).join('')}</div>`).join('')}
<h2>Накопления</h2><div class=c>${S.sv.map(x=>`<div class=row><span class=mu style="align-self:center">${dm(x.date)}</span><input type=number value=${x.amt} onchange="setSv('${x.id}',this.value)"><button class=d onclick="delSv('${x.id}')">×</button></div>`).join('')||'<span class=mu>Записей нет.</span>'}</div>
<h2>Данные</h2><div class=c><div class=mu>Скачивание файлов на опубликованной странице недоступно, поэтому данные копируются текстом.</div><b>Excel (вставьте в таблицу)</b><textarea id=tx rows=3>${esc(tbl('\t'))}</textarea><button onclick="cp('tx')">Копировать</button><div style="height:8px"></div><b>CSV</b><textarea id=tc rows=3>${esc(tbl(';'))}</textarea><button onclick="cp('tc')">Копировать</button><div style="height:8px"></div><b>Резервная копия JSON</b><textarea id=bk rows=3>${esc(JSON.stringify(S))}</textarea><div class=row><button onclick="cp('bk')">Копировать</button><button class=p onclick=restore()>Восстановить из текста</button></div><button class=d onclick=resetAll()>${RC?'Нажмите ещё раз: все данные будут стёрты':'Очистить все данные'}</button></div>`};
render();
</script></body></html>
